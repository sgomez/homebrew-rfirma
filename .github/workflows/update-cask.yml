name: Actualiza el cask

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Última Release de rFirma
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-cask.sh

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/rfirma.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "rfirma $version"
          git push
